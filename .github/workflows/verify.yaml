name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check --no-daemon

  native-container:
    name: Native container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          ./gradlew :server:build
          -Dquarkus.native.enabled=true
          -Dquarkus.native.container-build=true
          -Dquarkus.native.container-runtime=docker
          -Dquarkus.package.jar.enabled=false
          --no-daemon
      - name: Build native container
        run: |
          app_version="$(./gradlew properties --quiet --console=plain | sed -n 's/^version: //p')"
          test -n "$app_version"
          docker build \
            -f server/src/main/docker/Dockerfile.native \
            --build-arg APP_VERSION="$app_version" \
            -t vaultdatum-server:native-test server
      - run: docker run --detach --rm --name vaultdatum-native-test -p 18080:8080 vaultdatum-server:native-test
      - run: curl --fail --retry 10 --retry-all-errors --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/health
      - name: Verify a native mutation round trip and retry
        run: |
          smoke_directory="$(mktemp -d)"
          trap 'rm -rf "$smoke_directory"' EXIT
          content_path="$smoke_directory/content.md"
          metadata_path="$smoke_directory/operation.json"
          move_metadata_path="$smoke_directory/move.json"
          downloaded_path="$smoke_directory/downloaded.md"
          printf 'Native container synchronization smoke test\n' > "$content_path"
          content_hash="sha256:$(sha256sum "$content_path" | awk '{print $1}')"
          printf '%s\n' \
            "{\"operationId\":\"OP-native-ci\",\"clientId\":\"C-native-ci\",\"type\":\"CREATE\",\"path\":\"smoke/native.md\",\"base\":[{\"path\":\"smoke/native.md\",\"state\":\"UNKNOWN\"}],\"content\":{\"contentHash\":\"$content_hash\",\"size\":$(wc -c < "$content_path")}}" \
            > "$metadata_path"
          response="$(curl --fail --silent --show-error \
            --form "operation=<${metadata_path};type=application/json" \
            --form "content=@${content_path};type=application/octet-stream" \
            http://127.0.0.1:18080/api/v1/operations)"
          revision="$(printf '%s' "$response" | sed -n 's/.*"resultRevision":\([0-9][0-9]*\).*/\1/p')"
          test -n "$revision"
          printf '%s' "$response" | grep -q '"replayed":false'
          curl --fail --silent --show-error --get \
            --data-urlencode 'path=smoke/native.md' \
            --data-urlencode "revision=$revision" \
            --data-urlencode "hash=$content_hash" \
            --output "$downloaded_path" \
            http://127.0.0.1:18080/api/v1/content
          cmp "$content_path" "$downloaded_path"
          replay="$(curl --fail --silent --show-error \
            --form "operation=<${metadata_path};type=application/json" \
            --form "content=@${content_path};type=application/octet-stream" \
            http://127.0.0.1:18080/api/v1/operations)"
          printf '%s' "$replay" | grep -q '"replayed":true'
          printf '%s' "$replay" | grep -q "\"resultRevision\":$revision"
          printf '%s\n' \
            "{\"operationId\":\"OP-native-ci-move\",\"clientId\":\"C-native-ci\",\"type\":\"MOVE\",\"sourcePath\":\"smoke/native.md\",\"destinationPath\":\"smoke/moved.md\",\"base\":[{\"path\":\"smoke/native.md\",\"state\":\"PRESENT\",\"revision\":$revision,\"contentHash\":\"$content_hash\"},{\"path\":\"smoke/moved.md\",\"state\":\"UNKNOWN\"}]}" \
            > "$move_metadata_path"
          move_response="$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data-binary "@$move_metadata_path" \
            http://127.0.0.1:18080/api/v1/operations)"
          move_revision="$(printf '%s' "$move_response" | sed -n 's/.*"resultRevision":\([0-9][0-9]*\).*/\1/p')"
          test -n "$move_revision"
          printf '%s' "$move_response" | grep -q '"replayed":false'
          curl --fail --silent --show-error --get \
            --data-urlencode 'path=smoke/moved.md' \
            --data-urlencode "revision=$move_revision" \
            --data-urlencode "hash=$content_hash" \
            --output "$downloaded_path" \
            http://127.0.0.1:18080/api/v1/content
          cmp "$content_path" "$downloaded_path"
          move_replay="$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data-binary "@$move_metadata_path" \
            http://127.0.0.1:18080/api/v1/operations)"
          printf '%s' "$move_replay" | grep -q '"replayed":true'
          printf '%s' "$move_replay" | grep -q "\"resultRevision\":$move_revision"
      - if: always()
        run: docker stop vaultdatum-native-test || true

  obsidian-client:
    name: Obsidian client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/obsidian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/obsidian/package-lock.json
            protocol/package-lock.json
      - run: npm ci
      - run: npm --prefix ../../protocol ci
      - run: npm run protocol:check
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
