apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultdatum-server
  labels:
    app.kubernetes.io/name: vaultdatum-server
    app.kubernetes.io/part-of: vaultdatum
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultdatum-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultdatum-server
        app.kubernetes.io/part-of: vaultdatum
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: vaultdatum-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: VAULTDATUM_DATA_ROOT
              value: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultdatum-data
        - name: temporary-files
          emptyDir: {}
