vaultdatum:
  data-root: ${VAULTDATUM_DATA_ROOT:/data}
  max-content-bytes: ${VAULTDATUM_MAX_CONTENT_BYTES:8388608}
  access-profile: ${VAULTDATUM_ACCESS_PROFILE:private-network}
  initial-import: ${VAULTDATUM_INITIAL_IMPORT:false}

"%dev":
  vaultdatum:
    data-root: ${VAULTDATUM_DATA_ROOT:target/vaultdatum-data}

"%test":
  vaultdatum:
    data-root: ${VAULTDATUM_DATA_ROOT:target/vaultdatum-test-data}

quarkus:
  application:
    name: vaultdatum-server
  http:
    port: 8080
    limits:
      max-body-size: ${VAULTDATUM_MAX_REQUEST_BYTES:9M}
  datasource:
    db-kind: other
    jdbc:
      driver: org.sqlite.JDBC
      url: "jdbc:sqlite:file:${vaultdatum.data-root}/state/sync.db?journal_mode=WAL&synchronous=FULL&foreign_keys=on"
      max-size: 4
    devservices:
      enabled: false
    health:
      enabled: false
  flyway:
    migrate-at-start: false
    table: schema_migrations
