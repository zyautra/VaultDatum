name: vaultdatum

services:
  initialize-data:
    image: busybox:1.37.0
    command:
      - sh
      - -ec
      - >-
        mkdir -p /data/state/.sqlite-tmp
        && chown "${VAULTDATUM_RUNTIME_UID:-1001}:${VAULTDATUM_RUNTIME_GID:-0}"
        /data /data/state /data/state/.sqlite-tmp
        && chmod 0700 /data /data/state /data/state/.sqlite-tmp
    volumes:
      - vaultdatum-data:/data

  server:
    build:
      context: ./server
      dockerfile: src/main/docker/Dockerfile.native
      args:
        APP_VERSION: "0.5.1"
    image: vaultdatum-server:local
    user: "${VAULTDATUM_RUNTIME_UID:-1001}:${VAULTDATUM_RUNTIME_GID:-0}"
    depends_on:
      initialize-data:
        condition: service_completed_successfully
    ports:
      - "${VAULTDATUM_HTTP_PORT:-8080}:8080"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - vaultdatum-data:/data

volumes:
  vaultdatum-data:
