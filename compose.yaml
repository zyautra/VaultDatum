name: vaultdatum

services:
  initialize-data:
    image: busybox:1.37.0
    command:
      - sh
      - -ec
      - mkdir -p /var/lib/vaultdatum && chown -R 1001:0 /var/lib/vaultdatum
    volumes:
      - vaultdatum-data:/var/lib/vaultdatum

  server:
    build:
      context: ./server
      dockerfile: src/main/docker/Dockerfile.native
    image: vaultdatum-server:local
    depends_on:
      initialize-data:
        condition: service_completed_successfully
    environment:
      VAULTDATUM_DATABASE_URL: jdbc:sqlite:/var/lib/vaultdatum/vaultdatum.db
    ports:
      - "${VAULTDATUM_HTTP_PORT:-8080}:8080"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - vaultdatum-data:/var/lib/vaultdatum

volumes:
  vaultdatum-data:
