name: vaultdatum

services:
  initialize-data:
    image: busybox:1.37.0
    command:
      - sh
      - -ec
      - mkdir -p /data/state/.sqlite-tmp && chown -R 1001:0 /data
    volumes:
      - vaultdatum-data:/data

  server:
    build:
      context: ./server
      dockerfile: src/main/docker/Dockerfile.native
    image: vaultdatum-server:local
    depends_on:
      initialize-data:
        condition: service_completed_successfully
    ports:
      - "${VAULTDATUM_HTTP_PORT:-8080}:8080"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - vaultdatum-data:/data

volumes:
  vaultdatum-data:
