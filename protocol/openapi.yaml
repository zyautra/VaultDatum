openapi: 3.1.1
info:
  title: VaultDatum API
  version: 0.1.0
  description: |
    The protocol contract between the authoritative VaultDatum server and its
    replica clients. Realtime notifications may trigger synchronization, but
    correctness depends only on these HTTP operations.
servers:
  - url: http://localhost:8080
tags:
  - name: System
  - name: Synchronization
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Report server availability
      responses:
        "200":
          description: Server is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/vault:
    get:
      tags:
        - Synchronization
      operationId: getVault
      summary: Read the authoritative Vault identity and revision range
      responses:
        "200":
          description: Current Vault metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/changes:
    get:
      tags:
        - Synchronization
      operationId: listChanges
      summary: Read committed changes after a client cursor
      parameters:
        - $ref: "#/components/parameters/AfterRevision"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Changes in ascending revision order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The requested history is no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/path-state:
    get:
      tags:
        - Synchronization
      operationId: getPathState
      summary: Read the current authoritative state of a sync path
      parameters:
        - $ref: "#/components/parameters/SyncPathParameter"
      responses:
        "200":
          description: Current state, including UNKNOWN for a path with no history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/content:
    get:
      tags:
        - Synchronization
      operationId: downloadContent
      summary: Download content only while its path state matches
      description: |
        `revision` is the latest revision of this path, not the current global
        Vault revision. If the path changes before the content is read, the
        server returns `STATE_CHANGED` instead of historical content.
      parameters:
        - $ref: "#/components/parameters/SyncPathParameter"
        - $ref: "#/components/parameters/PathRevisionParameter"
        - $ref: "#/components/parameters/ContentHashParameter"
      responses:
        "200":
          description: Current file content
          headers:
            X-VaultDatum-Content-Hash:
              description: Hash of the returned bytes
              schema:
                $ref: "#/components/schemas/ContentHash"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The current path state no longer matches the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/operations:
    post:
      tags:
        - Synchronization
      operationId: submitOperation
      summary: Submit an idempotent mutation to the authoritative Vault
      description: |
        DELETE, RENAME, and MOVE use `application/json`. CREATE and MODIFY use
        `multipart/form-data`, with JSON metadata in `operation` and the file
        bytes in `content`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataOperationRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ContentOperationUpload"
            encoding:
              operation:
                contentType: application/json
              content:
                contentType: application/octet-stream
      responses:
        "200":
          description: The operation was committed, or a prior commit was replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Base conflict or reuse of an operation ID for another request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OperationConflict"
                  - $ref: "#/components/schemas/ProtocolError"
        "413":
          description: Uploaded content exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "422":
          description: The request is valid JSON but cannot be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
components:
  parameters:
    AfterRevision:
      name: after
      in: query
      required: true
      description: Return changes with a revision strictly greater than this cursor.
      schema:
        $ref: "#/components/schemas/CursorRevision"
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of changes to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 500
    SyncPathParameter:
      name: path
      in: query
      required: true
      description: Vault-root-relative logical path using `/` separators.
      schema:
        $ref: "#/components/schemas/SyncPath"
    PathRevisionParameter:
      name: revision
      in: query
      required: true
      description: Latest committed revision of the requested path.
      schema:
        $ref: "#/components/schemas/CommittedRevision"
    ContentHashParameter:
      name: hash
      in: query
      required: true
      description: Expected hash of the requested file content.
      schema:
        $ref: "#/components/schemas/ContentHash"
  responses:
    InvalidRequest:
      description: Request syntax or input is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtocolError"
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtocolError"
    Forbidden:
      description: The caller is not allowed to access this Vault
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtocolError"
    ServerUnavailable:
      description: The server is recovering or is not ready
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtocolError"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    VaultId:
      type: string
      minLength: 1
      description: Stable identity of an authoritative Vault revision lineage.
    ClientId:
      type: string
      minLength: 1
      description: Stable identity of one client installation.
    OperationId:
      type: string
      minLength: 1
      description: Idempotency key for one logical client mutation.
    CursorRevision:
      type: integer
      format: int64
      minimum: 0
      description: Contiguous committed revision cursor; zero means no changes processed.
    CommittedRevision:
      type: integer
      format: int64
      minimum: 1
      description: Server-assigned global commit order.
    SyncPath:
      type: string
      minLength: 1
      description: |
        Vault-root-relative logical path. Absolute paths, traversal segments,
        backslashes, and `.obsidian` are invalid.
    ContentHash:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
      description: Canonical SHA-256 hash (`sha256:` plus lowercase hexadecimal).
    EntryType:
      type: string
      enum:
        - FILE
        - DIRECTORY
    ChangeType:
      type: string
      enum:
        - CREATE
        - MODIFY
        - DELETE
        - RENAME
        - MOVE
    VaultInfo:
      type: object
      additionalProperties: false
      required:
        - vaultId
        - currentRevision
        - oldestRetainedRevision
        - protocolVersion
        - hashAlgorithm
      properties:
        vaultId:
          $ref: "#/components/schemas/VaultId"
        currentRevision:
          $ref: "#/components/schemas/CursorRevision"
        oldestRetainedRevision:
          $ref: "#/components/schemas/CursorRevision"
        protocolVersion:
          type: integer
          format: int32
          const: 1
        hashAlgorithm:
          type: string
          const: SHA-256
    PathState:
      oneOf:
        - $ref: "#/components/schemas/UnknownPathState"
        - $ref: "#/components/schemas/PresentFilePathState"
        - $ref: "#/components/schemas/PresentDirectoryPathState"
        - $ref: "#/components/schemas/DeletedPathState"
    UnknownPathState:
      type: object
      additionalProperties: false
      required:
        - path
        - state
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        state:
          type: string
          const: UNKNOWN
    PresentFilePathState:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - revision
        - contentHash
        - size
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          type: string
          const: FILE
        state:
          type: string
          const: PRESENT
        revision:
          $ref: "#/components/schemas/CommittedRevision"
        contentHash:
          $ref: "#/components/schemas/ContentHash"
        size:
          type: integer
          format: int64
          minimum: 0
    PresentDirectoryPathState:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - revision
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          type: string
          const: DIRECTORY
        state:
          type: string
          const: PRESENT
        revision:
          $ref: "#/components/schemas/CommittedRevision"
    DeletedPathState:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - revision
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          $ref: "#/components/schemas/EntryType"
        state:
          type: string
          const: DELETED
        revision:
          $ref: "#/components/schemas/CommittedRevision"
    ChangePage:
      type: object
      additionalProperties: false
      required:
        - vaultId
        - fromExclusive
        - toInclusive
        - currentRevision
        - hasMore
        - changes
      properties:
        vaultId:
          $ref: "#/components/schemas/VaultId"
        fromExclusive:
          $ref: "#/components/schemas/CursorRevision"
        toInclusive:
          $ref: "#/components/schemas/CursorRevision"
        currentRevision:
          $ref: "#/components/schemas/CursorRevision"
        hasMore:
          type: boolean
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
    Change:
      type: object
      additionalProperties: false
      required:
        - revision
        - type
        - operationId
        - actor
        - effects
      properties:
        revision:
          $ref: "#/components/schemas/CommittedRevision"
        type:
          $ref: "#/components/schemas/ChangeType"
        operationId:
          $ref: "#/components/schemas/OperationId"
        actor:
          $ref: "#/components/schemas/ChangeActor"
        sourcePath:
          $ref: "#/components/schemas/SyncPath"
        destinationPath:
          $ref: "#/components/schemas/SyncPath"
        effects:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChangeEffect"
    ChangeActor:
      oneOf:
        - $ref: "#/components/schemas/ClientChangeActor"
        - $ref: "#/components/schemas/ServerChangeActor"
    ClientChangeActor:
      type: object
      additionalProperties: false
      required:
        - type
        - clientId
      properties:
        type:
          type: string
          const: CLIENT
        clientId:
          $ref: "#/components/schemas/ClientId"
    ServerChangeActor:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - SERVER_EXTERNAL
            - SYSTEM
    ChangeEffect:
      oneOf:
        - $ref: "#/components/schemas/PresentFileChangeEffect"
        - $ref: "#/components/schemas/PresentDirectoryChangeEffect"
        - $ref: "#/components/schemas/DeletedChangeEffect"
    PresentFileChangeEffect:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - contentHash
        - size
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          type: string
          const: FILE
        state:
          type: string
          const: PRESENT
        contentHash:
          $ref: "#/components/schemas/ContentHash"
        size:
          type: integer
          format: int64
          minimum: 0
    PresentDirectoryChangeEffect:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          type: string
          const: DIRECTORY
        state:
          type: string
          const: PRESENT
    DeletedChangeEffect:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          $ref: "#/components/schemas/EntryType"
        state:
          type: string
          const: DELETED
    BaseCondition:
      oneOf:
        - $ref: "#/components/schemas/UnknownBaseCondition"
        - $ref: "#/components/schemas/PresentBaseCondition"
        - $ref: "#/components/schemas/DeletedBaseCondition"
    UnknownBaseCondition:
      type: object
      additionalProperties: false
      required:
        - path
        - state
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        state:
          type: string
          const: UNKNOWN
    PresentBaseCondition:
      type: object
      additionalProperties: false
      required:
        - path
        - state
        - revision
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        state:
          type: string
          const: PRESENT
        revision:
          $ref: "#/components/schemas/CommittedRevision"
        contentHash:
          $ref: "#/components/schemas/ContentHash"
    DeletedBaseCondition:
      type: object
      additionalProperties: false
      required:
        - path
        - state
        - revision
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        state:
          type: string
          const: DELETED
        revision:
          $ref: "#/components/schemas/CommittedRevision"
    ContentDescriptor:
      type: object
      additionalProperties: false
      required:
        - contentHash
        - size
      properties:
        contentHash:
          $ref: "#/components/schemas/ContentHash"
        size:
          type: integer
          format: int64
          minimum: 0
    OperationRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateOperationRequest"
        - $ref: "#/components/schemas/ModifyOperationRequest"
        - $ref: "#/components/schemas/DeleteOperationRequest"
        - $ref: "#/components/schemas/RenameOperationRequest"
        - $ref: "#/components/schemas/MoveOperationRequest"
    ContentOperationRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateOperationRequest"
        - $ref: "#/components/schemas/ModifyOperationRequest"
    MetadataOperationRequest:
      oneOf:
        - $ref: "#/components/schemas/DeleteOperationRequest"
        - $ref: "#/components/schemas/RenameOperationRequest"
        - $ref: "#/components/schemas/MoveOperationRequest"
    CreateOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - path
        - base
        - content
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: CREATE
        path:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/BaseCondition"
        content:
          $ref: "#/components/schemas/ContentDescriptor"
    ModifyOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - path
        - base
        - content
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: MODIFY
        path:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/BaseCondition"
        content:
          $ref: "#/components/schemas/ContentDescriptor"
    DeleteOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - path
        - base
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: DELETE
        path:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/BaseCondition"
    RenameOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - sourcePath
        - destinationPath
        - base
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: RENAME
        sourcePath:
          $ref: "#/components/schemas/SyncPath"
        destinationPath:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/BaseCondition"
    MoveOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - sourcePath
        - destinationPath
        - base
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: MOVE
        sourcePath:
          $ref: "#/components/schemas/SyncPath"
        destinationPath:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/BaseCondition"
    ContentOperationUpload:
      type: object
      additionalProperties: false
      required:
        - operation
        - content
      properties:
        operation:
          $ref: "#/components/schemas/ContentOperationRequest"
        content:
          type: string
          format: binary
    OperationResult:
      type: object
      additionalProperties: false
      required:
        - operationId
        - status
        - resultRevision
        - replayed
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        status:
          type: string
          const: COMMITTED
        resultRevision:
          $ref: "#/components/schemas/CommittedRevision"
        replayed:
          type: boolean
          description: True when returning the result of an already committed retry.
    OperationConflict:
      type: object
      additionalProperties: false
      required:
        - operationId
        - status
        - error
        - currentStates
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        status:
          type: string
          const: REJECTED_CONFLICT
        error:
          $ref: "#/components/schemas/ErrorDetail"
        currentStates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PathState"
    ProtocolError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - INVALID_PATH
            - PATH_EXCLUDED
            - VAULT_MISMATCH
            - BASE_STATE_MISMATCH
            - OPERATION_ID_REUSED
            - CONTENT_HASH_MISMATCH
            - STATE_CHANGED
            - HISTORY_NOT_AVAILABLE
            - MANIFEST_EXPIRED
            - RECOVERY_REQUIRED
            - SERVER_NOT_READY
            - UNAUTHORIZED
            - FORBIDDEN
        message:
          type: string
        details:
          type: object
          additionalProperties: true
