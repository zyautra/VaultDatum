        path:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/BaseCondition"
    RenameOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - sourcePath
        - destinationPath
        - base
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: RENAME
        sourcePath:
          $ref: "#/components/schemas/SyncPath"
        destinationPath:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/BaseCondition"
    MoveOperationRequest:
      type: object
