openapi: 3.1.1
info:
  title: VaultDatum API
  version: 0.1.0
  description: |
    The protocol contract between the authoritative VaultDatum server and its
    replica clients. Realtime notifications may trigger synchronization, but
    correctness depends only on these HTTP operations.

    A private-network deployment relies on its protected network. In a
    public-token deployment, every /api/v1 HTTP operation requires the
    VaultBearerToken Authorization header; notification WebSocket upgrades use
    a one-time RealtimeTicket instead. Tokens and tickets never appear in URLs.
servers:
  - url: http://localhost:8080
tags:
  - name: System
  - name: Synchronization
  - name: Realtime
  - name: History
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Report server availability
      responses:
        "200":
          description: Server is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/vault:
    get:
      tags:
        - Synchronization
      operationId: getVault
      summary: Read the authoritative Vault identity and revision range
      responses:
        "200":
          description: Current Vault metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/notifications:
    get:
      tags:
        - Realtime
      operationId: subscribeNotifications
      summary: Receive advisory Server revision notifications
      description: |
        WebSocket upgrade endpoint. Messages are advisory and may be lost,
        duplicated, or reordered; clients must fetch authoritative state using
        the synchronization HTTP endpoints.
      x-vaultdatum-websocket: true
      responses:
        "101":
          description: WebSocket protocol switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionAdvancedNotification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/realtime-tickets:
    post:
      tags:
        - Realtime
      operationId: createRealtimeTicket
      summary: Issue a one-time ticket for the notification WebSocket
      description: |
        Available only to an authenticated public-token client. The returned
        ticket is opaque, single-use, and expires within 60 seconds. Offer it
        as `vaultdatum.ticket.<ticket>` alongside `vaultdatum.v1` in
        Sec-WebSocket-Protocol; do not put it in a URL, cookie, or WebSocket
        message.
      security:
        - VaultBearerToken: []
      responses:
        "201":
          description: A short-lived ticket for one notification handshake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/manifests:
    post:
      tags:
        - Synchronization
      operationId: createManifest
      summary: Create a point-in-time manifest of authoritative path state
      responses:
        "201":
          description: Manifest snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/manifests/{manifestId}:
    get:
      tags:
        - Synchronization
      operationId: getManifest
      summary: Read a point-in-time manifest before it expires
      parameters:
        - $ref: "#/components/parameters/ManifestId"
      responses:
        "200":
          description: Authoritative path state at the manifest snapshot revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Manifest does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "409":
          description: Manifest lifetime elapsed before it could be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/changes:
    get:
      tags:
        - Synchronization
      operationId: listChanges
      summary: Read committed changes after a client cursor
      parameters:
        - $ref: "#/components/parameters/AfterRevision"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Changes in ascending revision order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The requested history is no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/path-state:
    get:
      tags:
        - Synchronization
      operationId: getPathState
      summary: Read the current authoritative state of a sync path
      parameters:
        - $ref: "#/components/parameters/SyncPathParameter"
      responses:
        "200":
          description: Current state, including UNKNOWN for a path with no history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/content:
    get:
      tags:
        - Synchronization
      operationId: downloadContent
      summary: Download content only while its path state matches
      description: |
        `revision` is the latest revision of this path, not the current global
        Vault revision. If the path changes before the content is read, the
        server returns `STATE_CHANGED` instead of historical content.
      parameters:
        - $ref: "#/components/parameters/SyncPathParameter"
        - $ref: "#/components/parameters/PathRevisionParameter"
        - $ref: "#/components/parameters/ContentHashParameter"
      responses:
        "200":
          description: Current file content
          headers:
            X-VaultDatum-Content-Hash:
              description: Hash of the returned bytes
              schema:
                $ref: "#/components/schemas/ContentHash"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The current path state no longer matches the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/history:
    get:
      tags:
        - History
      operationId: listFileHistory
      summary: List the committed changes of one file, newest first
      description: |
        Used only to restore a single file. Synchronization never depends on
        history. Entries whose content is no longer kept report
        `contentAvailable: false`.
      parameters:
        - $ref: "#/components/parameters/SyncPathParameter"
        - name: before
          in: query
          required: false
          description: Return entries with a revision strictly lower than this one.
          schema:
            $ref: "#/components/schemas/CommittedRevision"
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: File history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/history/content:
    get:
      tags:
        - History
      operationId: downloadHistoryContent
      summary: Download kept content by hash
      description: |
        Returns content kept in history or held by a current Vault file. The
        server verifies the hash before returning bytes.
      parameters:
        - name: contentHash
          in: query
          required: true
          description: Hash of the requested content.
          schema:
            $ref: "#/components/schemas/ContentHash"
      responses:
        "200":
          description: Kept content
          headers:
            X-VaultDatum-Content-Hash:
              description: Hash of the returned bytes
              schema:
                $ref: "#/components/schemas/ContentHash"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The content is no longer kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /api/v1/operations:
    post:
      tags:
        - Synchronization
      operationId: submitOperation
      summary: Submit an idempotent mutation to the authoritative Vault
      description: |
        File CREATE and MODIFY use `multipart/form-data`, with JSON metadata in
        `operation` and the file bytes in `content`. DELETE, RENAME, MOVE, and
        empty-directory mutations use `application/json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataOperationRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ContentOperationUpload"
            encoding:
              operation:
                contentType: application/json
              content:
                contentType: application/octet-stream
      responses:
        "200":
          description: The operation was committed, or a prior commit was replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Base conflict or reuse of an operation ID for another request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OperationConflict"
                  - $ref: "#/components/schemas/ProtocolError"
        "413":
          description: Uploaded content exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "422":
          description: The request is valid JSON but cannot be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
components:
  parameters:
    AfterRevision:
      name: after
      in: query
      required: true
      description: Return changes with a revision strictly greater than this cursor.
      schema:
        $ref: "#/components/schemas/CursorRevision"
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of changes to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 500
    ManifestId:
      name: manifestId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ManifestId"
    SyncPathParameter:
      name: path
      in: query
      required: true
      description: Vault-root-relative logical path using `/` separators.
      schema:
        $ref: "#/components/schemas/SyncPath"
    PathRevisionParameter:
      name: revision
      in: query
      required: true
      description: Latest committed revision of the requested path.
      schema:
        $ref: "#/components/schemas/CommittedRevision"
    ContentHashParameter:
      name: hash
      in: query
      required: true
      description: Expected hash of the requested file content.
      schema:
        $ref: "#/components/schemas/ContentHash"
  responses:
    InvalidRequest:
      description: Request syntax or input is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtocolError"
    Unauthorized:
      description: Authentication is required
      headers:
        WWW-Authenticate:
          description: Bearer challenge for a public-token deployment.
          schema:
            type: string
            const: Bearer realm="vaultdatum"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtocolError"
    Forbidden:
      description: The caller is not allowed to access this Vault
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtocolError"
    ServerUnavailable:
      description: The server is recovering or is not ready
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtocolError"
  securitySchemes:
    VaultBearerToken:
      type: http
      scheme: bearer
      bearerFormat: VaultDatum Vault token
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    VaultId:
      type: string
      minLength: 1
      description: Stable identity of an authoritative Vault revision lineage.
    ClientId:
      type: string
      minLength: 1
      description: Stable identity of one client installation.
    OperationId:
      type: string
      minLength: 1
      description: Idempotency key for one logical client mutation.
    ManifestId:
      type: string
      minLength: 1
      description: Opaque identifier of a short-lived immutable manifest snapshot.
    RealtimeTicket:
      type: object
      additionalProperties: false
      required:
        - ticket
        - expiresAt
      properties:
        ticket:
          type: string
          minLength: 1
          description: Opaque, single-use notification ticket. Treat as a secret.
        expiresAt:
          type: string
          format: date-time
          description: UTC instant after which the ticket cannot be used.
    CursorRevision:
      type: integer
      format: int64
      minimum: 0
      description: Contiguous committed revision cursor; zero means no changes processed.
    CommittedRevision:
      type: integer
      format: int64
      minimum: 1
      description: Server-assigned global commit order.
    SyncPath:
      type: string
      minLength: 1
      description: |
        Vault-root-relative logical path. Absolute paths, traversal segments,
        backslashes, and `.obsidian` are invalid.
    ContentHash:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
      description: Canonical SHA-256 hash (`sha256:` plus lowercase hexadecimal).
    EntryType:
      type: string
      enum:
        - FILE
        - DIRECTORY
    ChangeType:
      type: string
      enum:
        - CREATE
        - MODIFY
        - DELETE
        - RENAME
        - MOVE
    VaultInfo:
      type: object
      additionalProperties: false
      required:
        - vaultId
        - currentRevision
        - oldestRetainedRevision
        - protocolVersion
        - hashAlgorithm
      properties:
        vaultId:
          $ref: "#/components/schemas/VaultId"
        currentRevision:
          $ref: "#/components/schemas/CursorRevision"
        oldestRetainedRevision:
          $ref: "#/components/schemas/CursorRevision"
        protocolVersion:
          type: integer
          format: int32
          const: 1
        hashAlgorithm:
          type: string
          const: SHA-256
    RevisionAdvancedNotification:
      type: object
      additionalProperties: false
      required:
        - type
        - currentRevision
      properties:
        type:
          type: string
          const: REVISION_ADVANCED
        currentRevision:
          $ref: "#/components/schemas/CommittedRevision"
    ManifestCreated:
      type: object
      additionalProperties: false
      required:
        - manifestId
        - vaultId
        - snapshotRevision
        - expiresAt
      properties:
        manifestId:
          $ref: "#/components/schemas/ManifestId"
        vaultId:
          $ref: "#/components/schemas/VaultId"
        snapshotRevision:
          $ref: "#/components/schemas/CursorRevision"
        expiresAt:
          type: string
          format: date-time
    Manifest:
      type: object
      additionalProperties: false
      required:
        - manifestId
        - vaultId
        - snapshotRevision
        - expiresAt
        - entries
      properties:
        manifestId:
          $ref: "#/components/schemas/ManifestId"
        vaultId:
          $ref: "#/components/schemas/VaultId"
        snapshotRevision:
          $ref: "#/components/schemas/CursorRevision"
        expiresAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ManifestEntry"
    ManifestEntry:
      oneOf:
        - $ref: "#/components/schemas/PresentFileManifestEntry"
        - $ref: "#/components/schemas/PresentDirectoryManifestEntry"
        - $ref: "#/components/schemas/DeletedManifestEntry"
    PresentFileManifestEntry:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - revision
        - contentHash
        - size
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          type: string
          const: FILE
        state:
          type: string
          const: PRESENT
        revision:
          $ref: "#/components/schemas/CommittedRevision"
        contentHash:
          $ref: "#/components/schemas/ContentHash"
        size:
          type: integer
          format: int64
          minimum: 0
    PresentDirectoryManifestEntry:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - revision
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          type: string
          const: DIRECTORY
        state:
          type: string
          const: PRESENT
        revision:
          $ref: "#/components/schemas/CommittedRevision"
    DeletedManifestEntry:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - revision
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          $ref: "#/components/schemas/EntryType"
        state:
          type: string
          const: DELETED
        revision:
          $ref: "#/components/schemas/CommittedRevision"
    PathState:
      oneOf:
        - $ref: "#/components/schemas/UnknownPathState"
        - $ref: "#/components/schemas/PresentFilePathState"
        - $ref: "#/components/schemas/PresentDirectoryPathState"
        - $ref: "#/components/schemas/DeletedPathState"
    UnknownPathState:
      type: object
      additionalProperties: false
      required:
        - path
        - state
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        state:
          type: string
          const: UNKNOWN
    PresentFilePathState:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - revision
        - contentHash
        - size
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          type: string
          const: FILE
        state:
          type: string
          const: PRESENT
        revision:
          $ref: "#/components/schemas/CommittedRevision"
        contentHash:
          $ref: "#/components/schemas/ContentHash"
        size:
          type: integer
          format: int64
          minimum: 0
    PresentDirectoryPathState:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - revision
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          type: string
          const: DIRECTORY
        state:
          type: string
          const: PRESENT
        revision:
          $ref: "#/components/schemas/CommittedRevision"
    DeletedPathState:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - revision
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          $ref: "#/components/schemas/EntryType"
        state:
          type: string
          const: DELETED
        revision:
          $ref: "#/components/schemas/CommittedRevision"
    HistoryPage:
      type: object
      additionalProperties: false
      required:
        - path
        - entries
        - hasMore
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        hasMore:
          type: boolean
    HistoryEntry:
      type: object
      additionalProperties: false
      required:
        - revision
        - type
        - committedAt
        - actor
        - state
        - contentAvailable
      properties:
        revision:
          $ref: "#/components/schemas/CommittedRevision"
        type:
          $ref: "#/components/schemas/ChangeType"
        committedAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/ChangeActor"
        state:
          type: string
          enum:
            - PRESENT
            - DELETED
        contentHash:
          $ref: "#/components/schemas/ContentHash"
        size:
          type: integer
          format: int64
          minimum: 0
        contentAvailable:
          type: boolean
          description: True when the content of this entry can be downloaded.
        previousPath:
          $ref: "#/components/schemas/SyncPath"
    ChangePage:
      type: object
      additionalProperties: false
      required:
        - vaultId
        - fromExclusive
        - toInclusive
        - currentRevision
        - hasMore
        - changes
      properties:
        vaultId:
          $ref: "#/components/schemas/VaultId"
        fromExclusive:
          $ref: "#/components/schemas/CursorRevision"
        toInclusive:
          $ref: "#/components/schemas/CursorRevision"
        currentRevision:
          $ref: "#/components/schemas/CursorRevision"
        hasMore:
          type: boolean
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
    Change:
      type: object
      additionalProperties: false
      required:
        - revision
        - type
        - operationId
        - actor
        - effects
      properties:
        revision:
          $ref: "#/components/schemas/CommittedRevision"
        type:
          $ref: "#/components/schemas/ChangeType"
        operationId:
          $ref: "#/components/schemas/OperationId"
        actor:
          $ref: "#/components/schemas/ChangeActor"
        sourcePath:
          $ref: "#/components/schemas/SyncPath"
        destinationPath:
          $ref: "#/components/schemas/SyncPath"
        effects:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChangeEffect"
    ChangeActor:
      oneOf:
        - $ref: "#/components/schemas/ClientChangeActor"
        - $ref: "#/components/schemas/ServerChangeActor"
    ClientChangeActor:
      type: object
      additionalProperties: false
      required:
        - type
        - clientId
      properties:
        type:
          type: string
          const: CLIENT
        clientId:
          $ref: "#/components/schemas/ClientId"
    ServerChangeActor:
      type: object
      additionalProperties: false
      description: |
        Server-originated change. `SERVER_EXTERNAL` is recorded only for the
        one-time initial import of files copied into a new server Vault;
        direct server Vault edits are never imported as changes. `SYSTEM` is
        reserved.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - SERVER_EXTERNAL
            - SYSTEM
    ChangeEffect:
      oneOf:
        - $ref: "#/components/schemas/PresentFileChangeEffect"
        - $ref: "#/components/schemas/PresentDirectoryChangeEffect"
        - $ref: "#/components/schemas/DeletedChangeEffect"
    PresentFileChangeEffect:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
        - contentHash
        - size
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          type: string
          const: FILE
        state:
          type: string
          const: PRESENT
        contentHash:
          $ref: "#/components/schemas/ContentHash"
        size:
          type: integer
          format: int64
          minimum: 0
    PresentDirectoryChangeEffect:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          type: string
          const: DIRECTORY
        state:
          type: string
          const: PRESENT
    DeletedChangeEffect:
      type: object
      additionalProperties: false
      required:
        - path
        - entryType
        - state
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        entryType:
          $ref: "#/components/schemas/EntryType"
        state:
          type: string
          const: DELETED
    BaseCondition:
      oneOf:
        - $ref: "#/components/schemas/UnknownBaseCondition"
        - $ref: "#/components/schemas/PresentBaseCondition"
        - $ref: "#/components/schemas/PresentDirectoryBaseCondition"
        - $ref: "#/components/schemas/DeletedBaseCondition"
    UnknownBaseCondition:
      type: object
      additionalProperties: false
      required:
        - path
        - state
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        state:
          type: string
          const: UNKNOWN
    PresentBaseCondition:
      type: object
      additionalProperties: false
      required:
        - path
        - state
        - revision
        - contentHash
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        state:
          type: string
          const: PRESENT
        revision:
          $ref: "#/components/schemas/CommittedRevision"
        contentHash:
          $ref: "#/components/schemas/ContentHash"
    PresentDirectoryBaseCondition:
      type: object
      additionalProperties: false
      required:
        - path
        - state
        - revision
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        state:
          type: string
          const: PRESENT
        revision:
          $ref: "#/components/schemas/CommittedRevision"
    DeletedBaseCondition:
      type: object
      additionalProperties: false
      required:
        - path
        - state
        - revision
      properties:
        path:
          $ref: "#/components/schemas/SyncPath"
        state:
          type: string
          const: DELETED
        revision:
          $ref: "#/components/schemas/CommittedRevision"
    ContentDescriptor:
      type: object
      additionalProperties: false
      required:
        - contentHash
        - size
      properties:
        contentHash:
          $ref: "#/components/schemas/ContentHash"
        size:
          type: integer
          format: int64
          minimum: 0
    OperationRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateOperationRequest"
        - $ref: "#/components/schemas/ModifyOperationRequest"
        - $ref: "#/components/schemas/DeleteOperationRequest"
        - $ref: "#/components/schemas/RenameOperationRequest"
        - $ref: "#/components/schemas/MoveOperationRequest"
        - $ref: "#/components/schemas/DirectoryCreateOperationRequest"
        - $ref: "#/components/schemas/DirectoryDeleteOperationRequest"
        - $ref: "#/components/schemas/DirectoryRenameOperationRequest"
        - $ref: "#/components/schemas/DirectoryMoveOperationRequest"
    ContentOperationRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateOperationRequest"
        - $ref: "#/components/schemas/ModifyOperationRequest"
    MetadataOperationRequest:
      oneOf:
        - $ref: "#/components/schemas/DeleteOperationRequest"
        - $ref: "#/components/schemas/RenameOperationRequest"
        - $ref: "#/components/schemas/MoveOperationRequest"
        - $ref: "#/components/schemas/DirectoryCreateOperationRequest"
        - $ref: "#/components/schemas/DirectoryDeleteOperationRequest"
        - $ref: "#/components/schemas/DirectoryRenameOperationRequest"
        - $ref: "#/components/schemas/DirectoryMoveOperationRequest"
    CreateOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - path
        - base
        - content
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: CREATE
        path:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/BaseCondition"
        content:
          $ref: "#/components/schemas/ContentDescriptor"
    ModifyOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - path
        - base
        - content
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: MODIFY
        path:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/BaseCondition"
        content:
          $ref: "#/components/schemas/ContentDescriptor"
    DeleteOperationRequest:
