        - type
        - sourcePath
        - destinationPath
        - base
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: MOVE
        sourcePath:
          $ref: "#/components/schemas/SyncPath"
        destinationPath:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/BaseCondition"
    DirectoryCreateOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - entryType
        - path
        - base
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: CREATE
        entryType:
          type: string
          const: DIRECTORY
        path:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/UnknownBaseCondition"
    DirectoryDeleteOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - entryType
        - path
        - base
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: DELETE
        entryType:
          type: string
          const: DIRECTORY
        path:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/PresentDirectoryBaseCondition"
    DirectoryRenameOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - entryType
        - sourcePath
        - destinationPath
        - base
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: RENAME
        entryType:
          type: string
          const: DIRECTORY
        sourcePath:
          $ref: "#/components/schemas/SyncPath"
        destinationPath:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/BaseCondition"
    DirectoryMoveOperationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - clientId
        - type
        - entryType
        - sourcePath
        - destinationPath
        - base
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        clientId:
          $ref: "#/components/schemas/ClientId"
        type:
          type: string
          const: MOVE
        entryType:
          type: string
          const: DIRECTORY
        sourcePath:
          $ref: "#/components/schemas/SyncPath"
        destinationPath:
          $ref: "#/components/schemas/SyncPath"
        base:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/BaseCondition"
    ContentOperationUpload:
      type: object
      additionalProperties: false
      required:
        - operation
        - content
      properties:
        operation:
          $ref: "#/components/schemas/ContentOperationRequest"
        content:
          type: string
          format: binary
    OperationResult:
      type: object
      additionalProperties: false
      required:
        - operationId
        - status
        - resultRevision
        - replayed
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        status:
          type: string
          const: COMMITTED
        resultRevision:
          $ref: "#/components/schemas/CommittedRevision"
        replayed:
          type: boolean
          description: True when returning the result of an already committed retry.
    OperationConflict:
      type: object
      additionalProperties: false
      required:
        - operationId
        - status
        - error
        - currentStates
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        status:
          type: string
          const: REJECTED_CONFLICT
        error:
          $ref: "#/components/schemas/ErrorDetail"
        currentStates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PathState"
    ProtocolError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - INVALID_PATH
            - PATH_EXCLUDED
            - VAULT_MISMATCH
            - BASE_STATE_MISMATCH
            - OPERATION_ID_REUSED
            - CONTENT_HASH_MISMATCH
            - STATE_CHANGED
            - HISTORY_NOT_AVAILABLE
            - MANIFEST_EXPIRED
            - MANIFEST_NOT_FOUND
            - RECOVERY_REQUIRED
            - CONTENT_NOT_RETAINED
            - SERVER_NOT_READY
            - UNAUTHORIZED
            - FORBIDDEN
        message:
          type: string
        details:
          type: object
          additionalProperties: true
